#!/usr/sbin/nft -f
# =============================================================================
# Home Firewall — main ruleset
#
# Design:       docs/sdlc/03-design.md
# Requirements: docs/sdlc/01-requirements.md  (IDs like SR-01 are referenced below)
#
# Do not edit this file for a normal install. Site settings live in
# /etc/home-firewall/zones.nft. Apply changes with:  fw-apply /etc/nftables.conf
# =============================================================================

# D-08: start from a clean slate. The whole file is loaded atomically.
flush ruleset

# Site settings: WAN_IF, LAN_IF, GUEST_IF, IOT_IF, SSH_PORT  (NFR-01)
include "home-firewall/zones.nft"

define INTERNAL_IFS = { $LAN_IF, $GUEST_IF, $IOT_IF }

table inet filter {

    # SR-07: reserved / private / documentation ranges that must never be the
    # source of a NEW connection from the internet (RFC 6890, RFC 5737, RFC 6598).
    set bogons_v4 {
        type ipv4_addr
        flags interval
        elements = {
            0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8,
            169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24,
            192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24,
            224.0.0.0/4, 240.0.0.0/4
        }
    }

    # SR-07: IPv6 equivalents (RFC 6890, RFC 9637). Link-local (fe80::/10) is
    # deliberately absent: the ISP's router uses it for RA and DHCPv6.
    set bogons_v6 {
        type ipv6_addr
        flags interval
        elements = {
            ::1/128, ::ffff:0:0/96, 100::/64, 2001:10::/28, 2001:db8::/32,
            3fff::/20, fc00::/7, fec0::/10, ff00::/8
        }
    }

    # SR-09: per-source SSH attempt tracking. Entries expire on their own.
    set ssh_meter_v4 {
        type ipv4_addr
        size 65535
        flags dynamic, timeout
        timeout 5m
    }
    set ssh_meter_v6 {
        type ipv6_addr
        size 65535
        flags dynamic, timeout
        timeout 5m
    }

    # -------------------------------------------------------------------------
    # PREROUTING — runs before the routing decision, for every packet.
    # -------------------------------------------------------------------------
    chain prerouting {
        type filter hook prerouting priority mangle; policy accept;

        # Hosts with no address yet cannot pass a reverse-path check.
        # Only let through what they legitimately need: DHCP DISCOVER and
        # IPv6 duplicate address detection / MLD (ICMPv6 from ::).
        ip saddr 0.0.0.0 udp sport 68 udp dport 67 accept
        ip6 saddr :: meta l4proto ipv6-icmp accept

        # SR-06: strict reverse-path filter (anti-spoofing, BCP 38).
        fib saddr . iif oif missing counter drop

        # SR-07: bogon sources from the internet. New connections only, so
        # replies still work behind a modem with a private address (D-04).
        iifname $WAN_IF ct state new ip saddr @bogons_v4 counter drop
        iifname $WAN_IF ct state new ip6 saddr @bogons_v6 counter drop
    }

    # -------------------------------------------------------------------------
    # INPUT — traffic addressed to the router itself.          SR-01: drop.
    # -------------------------------------------------------------------------
    chain input {
        type filter hook input priority filter; policy drop;

        # SR-10: ping flood limits. These must come BEFORE the "established"
        # rule: conntrack treats a stream of pings as one established flow,
        # so a limit placed later would never see the flood.
        icmp type echo-request limit rate over 20/second burst 50 packets counter drop
        icmpv6 type echo-request iifname $WAN_IF limit rate over 5/second burst 10 packets counter drop
        icmpv6 type echo-request limit rate over 20/second burst 50 packets counter drop

        ct state established,related accept
        ct state invalid counter drop                                  # SR-08
        iif lo accept
        tcp flags & (fin|syn|rst|ack) != syn ct state new counter drop # SR-08

        meta l4proto { icmp, ipv6-icmp } jump input_icmp

        iifname vmap {
            $LAN_IF   : jump input_lan,
            $GUEST_IF : jump input_guest,
            $IOT_IF   : jump input_iot,
            $WAN_IF   : jump input_wan
        }

        # SR-10: never let an attacker flood the logs.
        limit rate 10/minute burst 20 packets log prefix "fw-input-drop: " level info
        counter
    }

    chain input_icmp {
        # FR-08: IPv4 ping from internal zones only (rate-limited in "input").
        # IPv4 ping from the WAN is not answered — SR-03, D-07.
        icmp type echo-request iifname $INTERNAL_IFS accept

        # FR-07: RFC 4890 — ICMPv6 that must not be dropped.
        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept

        # Neighbor discovery is link-local only: a hop limit of 255 proves the
        # packet was not routed from somewhere else.
        icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert } ip6 hoplimit 255 accept
        icmpv6 type nd-router-advert iifname $WAN_IF ip6 saddr fe80::/10 ip6 hoplimit 255 accept   # FR-06
        icmpv6 type nd-router-solicit iifname $INTERNAL_IFS ip6 hoplimit 255 accept
        icmpv6 type { mld-listener-query, mld-listener-report, mld-listener-done, mld2-listener-report } ip6 saddr { fe80::/10, :: } accept

        icmpv6 type echo-request iifname $INTERNAL_IFS accept
        icmpv6 type echo-request iifname $WAN_IF accept                                            # D-07

        # Anything else returns to the input chain and is dropped by policy.
    }

    # FR-04: services every internal zone may use.
    chain input_internal_services {
        meta l4proto { tcp, udp } th dport 53 accept                          # DNS
        meta nfproto ipv4 udp sport 68 udp dport 67 accept                    # DHCPv4 server
        ip6 saddr fe80::/10 udp sport 546 udp dport 547 accept                # DHCPv6 server
    }

    chain input_lan {
        jump input_internal_services

        # FR-05 / SR-09: SSH from LAN only, max 6 new attempts per minute per source.
        tcp dport $SSH_PORT update @ssh_meter_v4 { ip saddr limit rate over 6/minute burst 6 packets } counter drop
        tcp dport $SSH_PORT update @ssh_meter_v6 { ip6 saddr limit rate over 6/minute burst 6 packets } counter drop
        tcp dport $SSH_PORT accept
    }

    chain input_guest {
        jump input_internal_services                                          # SR-04: no SSH
    }

    chain input_iot {
        jump input_internal_services                                          # SR-05: no SSH
    }

    chain input_wan {
        # FR-06: replies to the router's own DHCP client. Nothing else (SR-03).
        meta nfproto ipv4 udp sport 67 udp dport 68 accept
        ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
    }

    # -------------------------------------------------------------------------
    # FORWARD — traffic passing through the router.             SR-01: drop.
    # -------------------------------------------------------------------------
    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        ct state invalid counter drop                                  # SR-08
        tcp flags & (fin|syn|rst|ack) != syn ct state new counter drop # SR-08

        # FR-07: ICMPv6 errors for real connections (e.g. packet-too-big for
        # path-MTU discovery) were accepted above as "related". Unsolicited
        # ICMP from the internet is not forwarded (D-09).

        # SR-11: egress hygiene for traffic towards the internet.
        oifname $WAN_IF jump forward_egress_hygiene

        # Zone policy matrix (design section 3.3). Not listed = dropped.
        # SR-02: nothing from the WAN appears here. SR-04/SR-05: no GUEST/IOT -> LAN.
        iifname . oifname vmap {
            $LAN_IF   . $WAN_IF : accept,                               # FR-01
            $LAN_IF   . $IOT_IF : accept,                               # FR-03
            $GUEST_IF . $WAN_IF : accept,                               # FR-02
            $IOT_IF   . $WAN_IF : accept                                # FR-03
        }

        # SR-12: port forwards (DNAT) are off by default. This rule only has an
        # effect if you deliberately add a DNAT rule to table ip nat.
        iifname $WAN_IF ct status dnat accept

        limit rate 10/minute burst 20 packets log prefix "fw-forward-drop: " level info  # SR-10
        counter
    }

    chain forward_egress_hygiene {
        # Windows RPC / NetBIOS / SMB must never leave the house.
        meta l4proto { tcp, udp } th dport { 135, 137-139, 445 } counter reject with icmpx admin-prohibited
        # Infected guest/IoT devices must not send spam directly.
        iifname { $GUEST_IF, $IOT_IF } tcp dport 25 counter reject with icmpx admin-prohibited
    }

    # -------------------------------------------------------------------------
    # OUTPUT — traffic from the router itself. Trusted (D-05, residual risk R4).
    # -------------------------------------------------------------------------
    chain output {
        type filter hook output priority filter; policy accept;
    }
}

# -----------------------------------------------------------------------------
# NAT (IPv4 only — IPv6 is routed, never NATed).
# SR-12: no port forwards. See docs/sdlc/06-deployment.md before adding one.
# -----------------------------------------------------------------------------
table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $WAN_IF masquerade                                     # FR-01
    }
}
