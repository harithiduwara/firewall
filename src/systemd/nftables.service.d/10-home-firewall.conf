# Home Firewall — fail-closed behaviour for nftables.service (SR-13).
[Unit]
# If the ruleset cannot be loaded, lock the router down instead of leaving it open.
OnFailure=home-firewall-lockdown.service

[Service]
# Turn on routing only after the firewall rules are in place.
ExecStartPost=/usr/sbin/sysctl -q -w net.ipv4.ip_forward=1 net.ipv6.conf.all.forwarding=1

# The stock unit runs "nft flush ruleset" on stop, which leaves the router
# wide open. Replace that with the lockdown ruleset and stop routing.
ExecStop=
ExecStop=/usr/sbin/sysctl -q -w net.ipv4.ip_forward=0 net.ipv6.conf.all.forwarding=0
ExecStop=/usr/sbin/nft -f /etc/home-firewall/lockdown.nft
