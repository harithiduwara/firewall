name: CI

on:
  push:
  pull_request:

# Least privilege for the workflow token.
permissions:
  contents: read

jobs:
  test:
    name: Lint and test (live packet tests in network namespaces)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to a full commit SHA (supply-chain hardening).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends nftables iproute2 iputils-ping shellcheck python3

      - name: Lint
        run: sudo make lint

      - name: Test (IPv6 required — skips are not allowed in CI)
        run: sudo REQUIRE_IPV6=1 tests/run.sh

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-report
          path: tests/out/
